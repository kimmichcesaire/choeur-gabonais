version: '3.9'

services:
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    ports:
      - '5173:5173'
    env_file: ./apps/frontend/.env
    depends_on:
      - backend

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    env_file: ./apps/backend/.env
    environment:
      NODE_ENV: production
